name: Scripts integrity

on:
  pull_request:
    paths:
      - 'plugins/Excalidraw/Scripts/**'
      - 'Excalidraw/Scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/*scripts*.yml'
  push:
    branches: [main]
    paths:
      - 'plugins/Excalidraw/Scripts/**'
      - 'Excalidraw/Scripts/**'
      - '.github/scripts/**'
      - '.github/workflows/*scripts*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Syntax check all vault scripts
        run: node .github/scripts/check_scripts.mjs .
      - name: Verify locked script consistency
        run: python .github/scripts/sync_scripts.py check --root .

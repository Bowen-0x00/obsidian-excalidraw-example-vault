name: Plugin integrity

on:
  pull_request:
    paths:
      - '.obsidian/plugins/obsidian-excalidraw-plugin-ymjr/**'
      - '.github/scripts/*plugin*'
      - '.github/workflows/*plugin*.yml'
  push:
    branches: [main]
    paths:
      - '.obsidian/plugins/obsidian-excalidraw-plugin-ymjr/**'
      - '.github/scripts/*plugin*'
      - '.github/workflows/*plugin*.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check plugin main.js
        run: |
          if [ -f .obsidian/plugins/obsidian-excalidraw-plugin-ymjr/main.js ]; then
            node --check .obsidian/plugins/obsidian-excalidraw-plugin-ymjr/main.js
            echo "main.js syntax check passed."
          fi
      - name: Auto-merge verified plugin PR
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.head.ref == 'automation/sync-plugin'
        env:
          VAULT_SYNC_TOKEN: ${{ secrets.VAULT_SYNC_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -c "
          import urllib.request, json, os
          token = os.environ.get('VAULT_SYNC_TOKEN')
          pr_num = os.environ.get('PR_NUMBER')
          if not token or not pr_num:
              print('Missing token or PR number, skipping auto-merge')
              exit(0)
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/pulls/{pr_num}/merge'
          req = urllib.request.Request(url,
              data=json.dumps({'merge_method': 'merge', 'commit_title': f'chore(plugin): auto-merge sync PR #{pr_num}'}).encode('utf-8'),
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/vnd.github+json', 'User-Agent': 'auto-merge'},
              method='PUT')
          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Successfully auto-merged plugin PR #{pr_num}: {resp.status}')
          except Exception as e:
              print(f'Auto-merge notice: {e}')
          "
